name: Desktop Wallet

on:
  push:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/wallet/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm packages
        working-directory: desktop/wallet
        run: npm ci

      - name: Build Linux wallet
        working-directory: desktop/wallet
        run: npm run build

      - name: Stage downloads
        working-directory: desktop/wallet
        run: npm run stage

      - uses: actions/upload-artifact@v4
        with:
          name: icpay-wallet-linux
          path: |
            downloads/linux/icpay-wallet-linux.rpm
            downloads/linux/icpay-wallet-linux.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/wallet/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm packages
        working-directory: desktop/wallet
        run: npm ci

      - name: Build Windows wallet
        working-directory: desktop/wallet
        run: npm run build

      - name: Stage downloads
        working-directory: desktop/wallet
        shell: bash
        run: npm run stage

      - uses: actions/upload-artifact@v4
        with:
          name: icpay-wallet-windows
          path: downloads/window/icpay-wallet-setup.exe
