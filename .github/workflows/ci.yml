name: CI

# The backend canister is never deployed from here. It custodies real user ICP,
# and auto-deploying would mean putting its controller key in a GitHub secret --
# a key that can also delete the canister. Shipping the backend stays a local
# command run by a human: npm run ci backend:deploy.
#
# The frontend is different: the deploy hook below only triggers a Vercel build
# of a commit that is already on main, and can neither read nor move funds.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The suite compiles each test with moc directly, so dfx is not needed.
      - run: npm i -g ic-mops
      - run: mops toolchain init
      - name: Install mops packages
        working-directory: backend
        run: |
          for i in 1 2 3; do
            mops install && exit 0
            echo "mops install failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1

      - run: bash scripts/run-tests.sh
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The lockfile is written by npm 11, which resolves @swc/core's optional
      # peer @swc/helpers differently than the npm 10 bundled with node 22 --
      # so `npm ci` on the bundled version reports the lockfile out of sync.
      - run: npm i -g npm@11

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      # Lint sits at a known baseline of 5 set-state-in-effect errors, so a bare
      # eslint call would fail the build. This fails only if the count RISES.
      - name: Lint (must not exceed baseline)
        working-directory: frontend
        run: |
          count=$(npx eslint services hooks components app lib --ext .ts,.tsx -f json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((n,f)=>n+f.errorCount,0)))')
          echo "eslint errors: $count (baseline 5)"
          test "$count" -le 5

      - run: npm run build
        working-directory: frontend

  # Fires only on main, and only once both suites are green -- a red build must
  # never reach icpay.app. The hook URL is a secret because anyone holding it can
  # trigger a production deploy.
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: |
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' \
            "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "deploy hook responded $code"
          test "$code" -ge 200 && test "$code" -lt 300
